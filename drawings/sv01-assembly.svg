<text x="40.0" y="458.0" class="th" text-anchor="start">조립 절차 및 확인 항목</text>
<rect x="40.0" y="470.0" width="436.0" height="152.0" class="ln2" />
<line x1="40.0" y1="502.0" x2="476.0" y2="502.0" class="ln2"/>
<circle cx="62.0" cy="486.0" r="12.0" class="fillA"/>
<text x="62.0" y="491.0" class="tb" text-anchor="middle">1</text>
<text x="84.0" y="491.0" class="th" text-anchor="start">베이스 링 앵커링</text>
<text x="56.0" y="526.0" class="td" text-anchor="start">·</text>
<text x="70.0" y="526.0" class="ts" text-anchor="start">베이스 링을 레벨 ±0.5 mm/m 이내로 앵커링</text>
<text x="56.0" y="548.0" class="td" text-anchor="start">·</text>
<text x="70.0" y="548.0" class="ts" text-anchor="start">모터가 지나갈 중앙 공동의 간섭 여부 확인</text>
<text x="56.0" y="570.0" class="td" text-anchor="start">·</text>
<text x="70.0" y="570.0" class="ts" text-anchor="start">스프링 시트 청소·이물 제거</text>
<rect x="40.0" y="642.0" width="436.0" height="152.0" class="ln2" />
<line x1="40.0" y1="674.0" x2="476.0" y2="674.0" class="ln2"/>
<circle cx="62.0" cy="658.0" r="12.0" class="fillA"/>
<text x="62.0" y="663.0" class="tb" text-anchor="middle">4</text>
<text x="84.0" y="663.0" class="th" text-anchor="start">클램프 체결</text>
<text x="56.0" y="698.0" class="td" text-anchor="start">·</text>
<text x="70.0" y="698.0" class="ts" text-anchor="start">토글 클램프 8 EA 를 대각선 순서로 2 회에 나누어 조인다</text>
<text x="56.0" y="720.0" class="td" text-anchor="start">·</text>
<text x="70.0" y="720.0" class="ts" text-anchor="start">체결 후 데크 간 단차 ≤ 0.5 mm</text>
<text x="56.0" y="742.0" class="td" text-anchor="start">·</text>
<text x="70.0" y="742.0" class="ts" text-anchor="start">메쉬 장력 — 손가락 압입 시 처짐 ≤ 2 mm</text>
<rect x="500.0" y="470.0" width="436.0" height="152.0" class="ln2" />
<line x1="500.0" y1="502.0" x2="936.0" y2="502.0" class="ln2"/>
<circle cx="522.0" cy="486.0" r="12.0" class="fillA"/>
<text x="522.0" y="491.0" class="tb" text-anchor="middle">2</text>
<text x="544.0" y="491.0" class="th" text-anchor="start">진동 테이블 + 모터</text>
<text x="516.0" y="526.0" class="td" text-anchor="start">·</text>
<text x="530.0" y="526.0" class="ts" text-anchor="start">진동모터를 테이블 하면에 체결 (모터는 반드시 스프링 위 진동체에)</text>
<text x="516.0" y="548.0" class="td" text-anchor="start">·</text>
<text x="530.0" y="548.0" class="ts" text-anchor="start">절연저항 ≥ 5 MΩ 확인 후 결선, 배선은 플렉시블 루프</text>
<text x="516.0" y="570.0" class="td" text-anchor="start">·</text>
<text x="530.0" y="570.0" class="ts" text-anchor="start">상·하 불평형추 위상각 45° (초기값) — 시운전에서 재조정</text>
<text x="516.0" y="592.0" class="td" text-anchor="start">·</text>
<text x="530.0" y="592.0" class="ts" text-anchor="start">스프링 6 EA(자유장 편차 ≤ 1 mm 짝) 위에 테이블 안착, 수평 ±1 mm</text>
<rect x="500.0" y="642.0" width="436.0" height="152.0" class="ln2" />
<line x1="500.0" y1="674.0" x2="936.0" y2="674.0" class="ln2"/>
<circle cx="522.0" cy="658.0" r="12.0" class="fillA"/>
<text x="522.0" y="663.0" class="tb" text-anchor="middle">5</text>
<text x="544.0" y="663.0" class="th" text-anchor="start">초음파 · 커버</text>
<text x="516.0" y="698.0" class="td" text-anchor="start">·</text>
<text x="530.0" y="698.0" class="ts" text-anchor="start">트랜스듀서 3 EA 를 프레임 외주에 볼트 고정 (18 N·m)</text>
<text x="516.0" y="720.0" class="td" text-anchor="start">·</text>
<text x="530.0" y="720.0" class="ts" text-anchor="start">제너레이터 배선 후 채널별 공진주파수 자동정합 실행</text>
<text x="516.0" y="742.0" class="td" text-anchor="start">·</text>
<text x="530.0" y="742.0" class="ts" text-anchor="start">상부 커버 장착, 피드 인렛에 플렉시블 연결</text>
<rect x="960.0" y="470.0" width="436.0" height="152.0" class="ln2" />
<line x1="960.0" y1="502.0" x2="1396.0" y2="502.0" class="ln2"/>
<circle cx="982.0" cy="486.0" r="12.0" class="fillA"/>
<text x="982.0" y="491.0" class="tb" text-anchor="middle">3</text>
<text x="1004.0" y="491.0" class="th" text-anchor="start">데크 적층</text>
<text x="976.0" y="526.0" class="td" text-anchor="start">·</text>
<text x="990.0" y="526.0" class="ts" text-anchor="start">아래에서부터 팬 → 75 → 106 → 250 µm 순으로 쌓는다</text>
<text x="976.0" y="548.0" class="td" text-anchor="start">·</text>
<text x="990.0" y="548.0" class="ts" text-anchor="start">데크마다 신품 실리콘 개스킷을 끼운다 (재사용 금지)</text>
<text x="976.0" y="570.0" class="td" text-anchor="start">·</text>
<text x="990.0" y="570.0" class="ts" text-anchor="start">배출구 방향이 120° 간격이 되도록 회전 정렬</text>
<rect x="960.0" y="642.0" width="436.0" height="152.0" class="ln2" />
<line x1="960.0" y1="674.0" x2="1396.0" y2="674.0" class="ln2"/>
<circle cx="982.0" cy="658.0" r="12.0" class="fillA"/>
<text x="982.0" y="663.0" class="tb" text-anchor="middle">6</text>
<text x="1004.0" y="663.0" class="th" text-anchor="start">시운전</text>
<text x="976.0" y="698.0" class="td" text-anchor="start">·</text>
<text x="990.0" y="698.0" class="ts" text-anchor="start">무부하 5 분 — 이상음·편진동 확인</text>
<text x="976.0" y="720.0" class="td" text-anchor="start">·</text>
<text x="990.0" y="720.0" class="ts" text-anchor="start">진폭 실측: 수직 3~5 mm (스티커 게이지)</text>
<text x="976.0" y="742.0" class="td" text-anchor="start">·</text>
<text x="990.0" y="742.0" class="ts" text-anchor="start">가진강도 Γ = A(2πf)²/g 가 4~6 g 인지 확인</text>
<text x="976.0" y="764.0" class="td" text-anchor="start">·</text>
<text x="990.0" y="764.0" class="ts" text-anchor="start">부하 운전 후 분획별 오버사이즈 혼입률 2 % 이하 확인</text>
<text x="40.0" y="838.0" class="ts" text-anchor="start">※ 클램프는 반드시 대각선 순서로 2 회 분할 체결한다. 한 번에 조이면 개스킷이 편측 압축되어 데크 간 누설이 생긴다.</text>
</svg>