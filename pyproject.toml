[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flotation-design"
version = "0.1.0"
description = "태양광 패널 재활용용 단단 부유선별기 설계 계산 (Ag/Cu 회수)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
flotation-design = "flotation_design.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
