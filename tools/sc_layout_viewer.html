<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="신규라인 레이아웃 3D — 로봇 이송 2대, reframe, 양면 8스핀들 가공기 2대, 대기 테이블, 투입 모듈·배출 유리 적재. SolidCraft 원본(.sc)의 형상을 그대로 삼각망으로 옮긴 뷰어.">
<title>신규라인 레이아웃 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap">
<style>
  :root{
    --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F6F8FA;
    --ink:#171F26; --ink-2:#57646F; --ink-3:#7E8B96;
    --line:#A8B3BE; --rule:#D3DAE1; --accent:#1F6FB2; --warn:#9E3623;
    --sky-top:#DCE3EA; --sky-bot:#F4F6F8; --floor:#E3E8EC; --grid:#C3CCD4;
    --sans:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1317; --surface:#151B21; --surface-2:#1B2329;
      --ink:#E2E8EE; --ink-2:#9DAAB6; --ink-3:#7A8894;
      --line:#4E5A65; --rule:#2A343C; --accent:#6FB1E8; --warn:#E08770;
      --sky-top:#0B1014; --sky-bot:#1A232A; --floor:#192127; --grid:#2C3740;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1317; --surface:#151B21; --surface-2:#1B2329;
    --ink:#E2E8EE; --ink-2:#9DAAB6; --ink-3:#7A8894;
    --line:#4E5A65; --rule:#2A343C; --accent:#6FB1E8; --warn:#E08770;
    --sky-top:#0B1014; --sky-bot:#1A232A; --floor:#192127; --grid:#2C3740;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
       -webkit-font-smoothing:antialiased;line-height:1.5;overflow:hidden}
  .app{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:100vh;height:100dvh}
  .stage{position:relative;min-width:0;min-height:0;overflow:hidden;
         background:linear-gradient(var(--sky-top),var(--sky-bot))}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas.dragging{cursor:grabbing}
  .hud{position:absolute;left:16px;top:14px;right:16px;display:flex;flex-wrap:wrap;gap:8px;
       align-items:flex-start;pointer-events:none}
  .title{pointer-events:auto;background:color-mix(in srgb,var(--surface) 88%,transparent);
         border:1px solid var(--rule);padding:8px 12px;backdrop-filter:blur(6px)}
  .title .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase}
  .title h1{margin:2px 0 0;font-size:18px;font-weight:600;letter-spacing:-.01em}
  .tools{pointer-events:auto;margin-left:auto;display:flex;flex-wrap:wrap;gap:4px}
  button,.chip{font:500 12px var(--mono);color:var(--ink);background:var(--surface);
         border:1px solid var(--line);padding:6px 10px;cursor:pointer;letter-spacing:.02em}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
  .labels{position:absolute;inset:0;pointer-events:none}
  .tag{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;
       font:500 11px var(--mono);color:var(--ink);background:color-mix(in srgb,var(--surface) 82%,transparent);
       border:1px solid var(--rule);padding:2px 6px}
  .tag::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:10px;background:var(--line)}
  .tip{position:absolute;pointer-events:none;font:12px var(--mono);background:var(--ink);color:var(--surface);
       padding:4px 8px;transform:translate(12px,12px);display:none;max-width:60ch;white-space:nowrap}
  .status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:13px var(--mono);color:var(--ink-2)}
  .axes{position:absolute;left:16px;bottom:14px;font:11px var(--mono);color:var(--ink-3);pointer-events:none}

  aside{border-left:1px solid var(--rule);background:var(--surface);overflow:auto;display:flex;flex-direction:column}
  aside section{padding:16px 18px;border-bottom:1px solid var(--rule)}
  aside h2{margin:0 0 10px;font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
  .comp{display:grid;grid-template-columns:18px 12px 1fr auto;gap:8px;align-items:center;padding:5px 0;font-size:13px}
  .comp input{margin:0;accent-color:var(--accent)}
  .sw{width:12px;height:12px;border:1px solid var(--line)}
  .comp .n{font-family:var(--mono);font-size:12px}
  .comp .d{grid-column:3/5;color:var(--ink-2);font-size:12px;margin-top:-4px}
  .comp .q{font:11px var(--mono);color:var(--ink-3)}
  dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
  dt{color:var(--ink-3);font-family:var(--mono);font-size:12px}
  dd{margin:0;font-family:var(--mono);font-size:12px;word-break:break-all}
  .empty{color:var(--ink-3);font-size:13px}
  .note{font-size:12px;color:var(--ink-2);margin:0}
  .note b{color:var(--warn);font-weight:500}
  .range{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font:12px var(--mono);color:var(--ink-2);margin-top:8px}
  .range input{width:100%;accent-color:var(--accent)}
  kbd{font:11px var(--mono);border:1px solid var(--line);padding:0 4px}
  @media (max-width:820px){
    body{overflow:auto}
    .app{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto}
    .stage{height:62vh}
    aside{border-left:0;border-top:1px solid var(--rule);overflow:visible}
    .title h1{font-size:15px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="gl" aria-label="신규라인 레이아웃 3D 뷰"></canvas>
    <div class="labels" id="labels"></div>
    <div class="hud">
      <div class="title"><div class="eyebrow">Layout · 3D</div><h1 id="docname">신규라인 레이아웃</h1></div>
      <div class="tools" role="toolbar" aria-label="보기">
        <button data-view="iso">ISO</button>
        <button data-view="top">평면</button>
        <button data-view="front">정면</button>
        <button data-view="side">측면</button>
        <button id="fit">전체</button>
        <button id="tagsBtn" aria-pressed="true">라벨</button>
        <button id="theme" title="테마 전환">◐</button>
      </div>
    </div>
    <div class="tip" id="tip"></div>
    <div class="status" id="status">형상 불러오는 중…</div>
    <div class="axes">드래그 회전 · 우클릭/Shift 이동 · 휠 확대 · 더블클릭 초점 · <span style="color:#C0392B">X</span> <span style="color:#2E8B57">Y</span> <span style="color:#2F6FD0">Z</span></div>
  </div>
  <aside>
    <section>
      <h2>부품 · 배치</h2>
      <div id="comps"></div>
    </section>
    <section>
      <h2>단면</h2>
      <div class="range"><span>X</span><input type="range" id="clipX" min="0" max="1000" value="1000" aria-label="X 단면 위치"><span id="clipXv">끔</span></div>
      <div class="range"><span>Z</span><input type="range" id="clipZ" min="0" max="1000" value="1000" aria-label="Z 단면 높이"><span id="clipZv">끔</span></div>
    </section>
    <section>
      <h2>선택 바디</h2>
      <div id="pick"><p class="empty">모델을 클릭하면 바디 이름·소속·치수가 표시된다.</p></div>
    </section>
    <section>
      <h2>레이아웃 전제</h2>
      <dl id="layout"></dl>
    </section>
    <section>
      <p class="note" id="status-note"></p>
    </section>
  </aside>
</div>

<script>
"use strict";
const META = /*__META__*/null;
const GEOMETRY_B64 = "__GEOMETRY_B64__";

const $ = s => document.querySelector(s);
const canvas = $("#gl");
const gl = canvas.getContext("webgl2", {antialias:true, preserveDrawingBuffer:false});
if (!gl) { $("#status").textContent = "WebGL2 를 지원하지 않는 브라우저입니다."; throw new Error("no webgl2"); }

// ── 수학 ────────────────────────────────────────────────────────────────
const M4 = {
  mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;},
  persp(fov,asp,n,f){const t=1/Math.tan(fov/2),o=new Float32Array(16);o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o;},
  ortho(w,h,n,f){const o=new Float32Array(16);o[0]=2/w;o[5]=2/h;o[10]=-2/(f-n);o[14]=-(f+n)/(f-n);o[15]=1;return o;},
  look(e,t,u){let z=norm(sub(e,t)),x=norm(cross(u,z)),y=cross(z,x);return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,e),-dot(y,e),-dot(z,e),1]);},
  apply(m,p){const x=p[0],y=p[1],z=p[2];const w=m[3]*x+m[7]*y+m[11]*z+m[15];return [(m[0]*x+m[4]*y+m[8]*z+m[12])/w,(m[1]*x+m[5]*y+m[9]*z+m[13])/w,(m[2]*x+m[6]*y+m[10]*z+m[14])/w];},
};
function sub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]]}
function add(a,b){return [a[0]+b[0],a[1]+b[1],a[2]+b[2]]}
function scl(a,s){return [a[0]*s,a[1]*s,a[2]*s]}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}
function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
function norm(a){const l=Math.hypot(...a)||1;return [a[0]/l,a[1]/l,a[2]/l]}

// ── 셰이더 ──────────────────────────────────────────────────────────────
const VS = `#version 300 es
layout(location=0) in vec3 aPos;      // 0..1 (uint16 정규화)
layout(location=1) in vec2 aOct;      // -1..1 (int8 정규화)
layout(location=2) in uint aBody;
uniform mat4 uVP, uModel;
uniform vec3 uLo, uSpan;
uniform sampler2D uColors;
uniform int uInst, uHovInst, uHovBody, uSelInst, uSelBody;
out vec3 vN; out vec3 vW; out vec3 vC; flat out uint vBody; out float vHi;
vec3 octDec(vec2 e){vec3 v=vec3(e,1.0-abs(e.x)-abs(e.y));if(v.z<0.0)v.xy=(1.0-abs(v.yx))*sign(v.xy);return normalize(v);}
void main(){
  vec4 w = uModel * vec4(uLo + aPos*uSpan, 1.0);
  vW = w.xyz;
  vN = mat3(uModel) * octDec(aOct);
  int b = int(aBody);
  vC = texelFetch(uColors, ivec2(b % 1024, b / 1024), 0).rgb;
  vBody = aBody;
  vHi = (uInst==uSelInst && b==uSelBody) ? 2.0 : ((uInst==uHovInst && b==uHovBody) ? 1.0 : 0.0);
  gl_Position = uVP * w;
}`;
const FS = `#version 300 es
precision highp float; precision highp int;
in vec3 vN; in vec3 vW; in vec3 vC; flat in uint vBody; in float vHi;
uniform vec3 uEye; uniform vec2 uClip; uniform int uPick; uniform int uInst; uniform vec3 uAccent;
out vec4 o;
void main(){
  if (vW.x > uClip.x || vW.z > uClip.y) discard;
  if (uPick==1){ o = vec4(float(uInst+1)/255.0, float(vBody & 255u)/255.0, float(vBody>>8)/255.0, 1.0); return; }
  vec3 n = normalize(vN);
  vec3 v = normalize(uEye - vW);
  if (dot(n,v) < 0.0) n = -n;               // 단면·뒤집힌 면도 밝게
  vec3 L1 = normalize(vec3(0.45,-0.35,0.82)), L2 = normalize(vec3(-0.6,0.7,0.3));
  float hemi = 0.5 + 0.5*n.z;
  vec3 c = vC * (0.34 + 0.20*hemi + 0.55*max(dot(n,L1),0.0) + 0.16*max(dot(n,L2),0.0));
  vec3 h = normalize(L1+v);
  c += 0.10*pow(max(dot(n,h),0.0), 40.0);
  float rim = pow(1.0-max(dot(n,v),0.0), 3.0);
  c += 0.05*rim;
  if (vHi > 1.5) c = mix(c, uAccent, 0.55);
  else if (vHi > 0.5) c = mix(c, uAccent, 0.28);
  o = vec4(pow(c, vec3(1.0/1.12)), 1.0);
}`;
const GVS = `#version 300 es
layout(location=0) in vec3 aPos; uniform mat4 uVP; out vec3 vW;
void main(){ vW=aPos; gl_Position=uVP*vec4(aPos,1.0); }`;
const GFS = `#version 300 es
precision highp float; in vec3 vW; uniform vec3 uFloor, uGrid; uniform float uStep; out vec4 o;
void main(){
  vec2 g = abs(fract(vW.xy/uStep - 0.5) - 0.5) / fwidth(vW.xy/uStep);
  vec2 g2 = abs(fract(vW.xy/(uStep*5.0) - 0.5) - 0.5) / fwidth(vW.xy/(uStep*5.0));
  float l = 1.0 - min(min(g.x,g.y),1.0);
  float l2 = 1.0 - min(min(g2.x,g2.y),1.0);
  vec3 c = mix(uFloor, uGrid, max(l*0.55, l2));
  o = vec4(c,1.0);
}`;
function prog(vs,fs){const p=gl.createProgram();for(const[t,s]of[[gl.VERTEX_SHADER,vs],[gl.FRAGMENT_SHADER,fs]]){const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(sh));gl.attachShader(p,sh);}gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));const u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);for(let i=0;i<n;i++){const a=gl.getActiveUniform(p,i);u[a.name]=gl.getUniformLocation(p,a.name);}return {p,u};}
const P = prog(VS,FS), G = prog(GVS,GFS);

// ── 상태 ────────────────────────────────────────────────────────────────
const comps = {};        // id → {vao, nt, lo, span, tex, meta, visible}
let instances = [];      // {c, m(Float32Array 열기준), label, world bbox}
let sceneLo=[0,0,0], sceneHi=[1,1,1];
const cam = {target:[0,0,0], dist:10000, yaw:-0.75, pitch:0.55, ortho:false};
let hov = {inst:-1, body:-1}, sel = {inst:-1, body:-1};
let clip = [1e9, 1e9];
let showTags = true;
let dirty = true;

function cssColor(name){
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const m = v.match(/^#([0-9a-f]{6})$/i);
  if (!m) return [0.5,0.5,0.5];
  const n = parseInt(m[1],16); return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];
}

async function inflate(b64){
  const bin = Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
  const ds = new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"));
  return new Uint8Array(await new Response(ds).arrayBuffer());
}

function pad4(n){return (n+3)&~3}

function upload(id, meta, all){
  const base = meta.offset, nv = meta.nv, nt = meta.nt;
  let o = base;
  const pos = all.subarray(o, o + nv*6); o += pad4(nv*6);
  const oct = all.subarray(o, o + nv*2); o += pad4(nv*2);
  const bid = all.subarray(o, o + nv*2); o += pad4(nv*2);
  const idx = new Uint32Array(all.buffer, all.byteOffset + o, nt);
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const mk = (data, loc, size, type, normalized, integer) => {
    const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW); gl.enableVertexAttribArray(loc);
    if (integer) gl.vertexAttribIPointer(loc, size, type, 0, 0);
    else gl.vertexAttribPointer(loc, size, type, normalized, 0, 0);
  };
  mk(pos, 0, 3, gl.UNSIGNED_SHORT, true);
  mk(oct, 1, 2, gl.BYTE, true);
  mk(bid, 2, 1, gl.UNSIGNED_SHORT, false, true);
  const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  // 바디 색 텍스처
  const nb = meta.colors.length, w = 1024, h = Math.ceil(nb/w);
  const px = new Uint8Array(w*h*4);
  meta.colors.forEach((c,i)=>{px[i*4]=c[0]*255;px[i*4+1]=c[1]*255;px[i*4+2]=c[2]*255;px[i*4+3]=255;});
  const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, px);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  comps[id] = {vao, nt, lo:meta.lo, span:meta.span, tex, meta, visible:true};
}

// 바닥 격자
let floorVao, floorStep = 500;
function buildFloor(){
  const m = 2500;
  const x0=sceneLo[0]-m, x1=sceneHi[0]+m, y0=sceneLo[1]-m, y1=sceneHi[1]+m, z=-1;
  const v = new Float32Array([x0,y0,z, x1,y0,z, x1,y1,z, x0,y0,z, x1,y1,z, x0,y1,z]);
  floorVao = gl.createVertexArray(); gl.bindVertexArray(floorVao);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, v, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0); gl.bindVertexArray(null);
}

// ── 카메라 ──────────────────────────────────────────────────────────────
function eye(){
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  return add(cam.target, scl([cp*Math.cos(cam.yaw), cp*Math.sin(cam.yaw), sp], cam.dist));
}
function matrices(){
  const w = canvas.width, h = canvas.height, asp = w/h;
  const e = eye();
  const up = Math.abs(Math.cos(cam.pitch)) < 1e-3 ? [Math.cos(cam.yaw+Math.PI), Math.sin(cam.yaw+Math.PI), 0] : [0,0,1];
  const V = M4.look(e, cam.target, up);
  const diag = Math.hypot(...sub(sceneHi, sceneLo));
  const n = Math.max(cam.dist*0.01, 5), f = cam.dist + diag*3;
  const Pm = cam.ortho ? M4.ortho(cam.dist*0.9*asp, cam.dist*0.9, -diag*4, diag*4) : M4.persp(0.75, asp, n, f);
  return {VP: M4.mul(Pm, V), e};
}
function fit(){
  cam.target = scl(add(sceneLo, sceneHi), 0.5);
  cam.dist = Math.hypot(...sub(sceneHi, sceneLo)) * 0.95;
  dirty = true;
}
function setView(v){
  cam.ortho = false;
  if (v==="iso"){cam.yaw=-0.75; cam.pitch=0.55;}
  if (v==="top"){cam.yaw=-Math.PI/2; cam.pitch=Math.PI/2-1e-4; cam.ortho=true;}
  if (v==="front"){cam.yaw=-Math.PI/2; cam.pitch=0.0001; cam.ortho=true;}
  if (v==="side"){cam.yaw=0; cam.pitch=0.0001; cam.ortho=true;}
  fit();
}

// ── 그리기 ──────────────────────────────────────────────────────────────
let pickFbo, pickTex, pickDepth, pickW=0, pickH=0;
function ensurePick(){
  if (pickW===canvas.width && pickH===canvas.height) return;
  pickW=canvas.width; pickH=canvas.height;
  pickFbo ??= gl.createFramebuffer();
  pickTex ??= gl.createTexture(); pickDepth ??= gl.createRenderbuffer();
  gl.bindTexture(gl.TEXTURE_2D, pickTex); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,pickW,pickH,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.bindRenderbuffer(gl.RENDERBUFFER, pickDepth); gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, pickW, pickH);
  gl.bindFramebuffer(gl.FRAMEBUFFER, pickFbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, pickTex, 0);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, pickDepth);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

function drawScene(pick){
  const {VP, e} = matrices();
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.enable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE);
  if (pick){ gl.clearColor(0,0,0,0); }
  else { gl.clearColor(0,0,0,0); }
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  if (!pick && floorVao){
    gl.useProgram(G.p); gl.uniformMatrix4fv(G.u.uVP,false,VP);
    gl.uniform3fv(G.u.uFloor, cssColor("--floor")); gl.uniform3fv(G.u.uGrid, cssColor("--grid"));
    gl.uniform1f(G.u.uStep, floorStep);
    gl.bindVertexArray(floorVao); gl.drawArrays(gl.TRIANGLES,0,6);
  }
  gl.useProgram(P.p);
  gl.uniformMatrix4fv(P.u.uVP,false,VP); gl.uniform3fv(P.u.uEye,e);
  gl.uniform2f(P.u.uClip, clip[0], clip[1]); gl.uniform1i(P.u.uPick, pick?1:0);
  gl.uniform3fv(P.u.uAccent, cssColor("--accent"));
  gl.uniform1i(P.u.uHovInst, hov.inst); gl.uniform1i(P.u.uHovBody, hov.body);
  gl.uniform1i(P.u.uSelInst, sel.inst); gl.uniform1i(P.u.uSelBody, sel.body);
  gl.activeTexture(gl.TEXTURE0); gl.uniform1i(P.u.uColors, 0);
  instances.forEach((ins,i)=>{
    const c = comps[ins.c]; if (!c || !c.visible || !ins.visible) return;
    gl.uniformMatrix4fv(P.u.uModel,false,ins.m); gl.uniform1i(P.u.uInst,i);
    gl.uniform3fv(P.u.uLo,c.lo); gl.uniform3fv(P.u.uSpan,c.span);
    gl.bindTexture(gl.TEXTURE_2D,c.tex); gl.bindVertexArray(c.vao);
    gl.drawElements(gl.TRIANGLES,c.nt,gl.UNSIGNED_INT,0);
  });
  gl.bindVertexArray(null);
  return VP;
}

function render(){
  if (dirty){
    dirty = false;
    const VP = drawScene(false);
    placeTags(VP);
  }
  requestAnimationFrame(render);
}

function pickAt(cx, cy){
  ensurePick();
  gl.bindFramebuffer(gl.FRAMEBUFFER, pickFbo);
  drawScene(true);
  const dpr = canvas.width / canvas.clientWidth;
  const x = Math.floor(cx*dpr), y = canvas.height - 1 - Math.floor(cy*dpr);
  const px = new Uint8Array(4); gl.readPixels(x,y,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
  // 깊이 → 월드 좌표 (더블클릭 초점용): 픽 버퍼 재사용 대신 근사로 바디 bbox 중심 사용
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  dirty = true;
  if (px[0]===0) return {inst:-1, body:-1};
  return {inst:px[0]-1, body:px[1] | (px[2]<<8)};
}

// ── 라벨 ────────────────────────────────────────────────────────────────
const tagEls = [];
function buildTags(){
  const box = $("#labels"); box.innerHTML = "";
  const groups = {};
  instances.forEach(ins=>{
    if (!ins.top) return;
    const g = groups[ins.label] ??= {lo:[1e9,1e9,1e9], hi:[-1e9,-1e9,-1e9], c:ins.c};
    for (let k=0;k<3;k++){g.lo[k]=Math.min(g.lo[k],ins.lo[k]); g.hi[k]=Math.max(g.hi[k],ins.hi[k]);}
  });
  for (const [label,g] of Object.entries(groups)){
    const el = document.createElement("div"); el.className="tag"; el.textContent = label.replace(/:(\d+)$/, " #$1");
    box.appendChild(el);
    tagEls.push({el, p:[(g.lo[0]+g.hi[0])/2,(g.lo[1]+g.hi[1])/2,g.hi[2]+150], c:g.c});
  }
}
function placeTags(VP){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  for (const t of tagEls){
    const vis = showTags && comps[t.c]?.visible;
    const p = M4.apply(VP, t.p);
    if (!vis || p[2]<-1 || p[2]>1){ t.el.style.display="none"; continue; }
    t.el.style.display=""; t.el.style.left=((p[0]+1)/2*w)+"px"; t.el.style.top=((1-p[1])/2*h - 10)+"px";
  }
}

// ── 패널 ────────────────────────────────────────────────────────────────
function rgbCss(c){return `rgb(${c.map(v=>Math.round(v*255)).join(",")})`}
function dominant(meta){
  // 삼각형 수가 아닌 바디 수 기준의 대표색
  const cnt = {}; meta.colors.forEach(c=>{const k=c.join();cnt[k]=(cnt[k]||0)+1;});
  return Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0].split(",").map(Number);
}
const KO = {
  ROBOT01:"로봇 이송 (7000 레일) + FANUC R-1000iA/80F + 유리 그리퍼",
  REFRAME_01:"reframe (현행)",
  MACHINING_01:"양면 8스핀들 가공기",
  WAIT_TABLE_1000_M20_C90:"대기/버퍼 테이블 1000×1000",
  INPUT_50_SOLAR_MODULES:"투입 — 태양광 모듈 50장 적재",
  OUTPUT_50_GLASS_SHEETS:"배출 — 유리 50장 적재",
  LAYOUT_FLOOR_REFERENCE:"바닥 배치 표시",
};
function buildPanel(){
  const host = $("#comps"); host.innerHTML="";
  const top = Object.entries(META.components).filter(([id,m])=>KO[m.name] || !m.name.startsWith("FANUC"));
  const fanucIds = Object.entries(META.components).filter(([id,m])=>m.name.startsWith("FANUC")).map(([id])=>id);
  for (const [id,m] of top){
    const q = instances.filter(i=>String(i.c)===id).length;
    const row = document.createElement("label"); row.className="comp";
    row.innerHTML = `<input type="checkbox" checked><span class="sw" style="background:${rgbCss(dominant(m))}"></span><span class="n">${m.name}</span><span class="q">×${q}</span><span class="d">${KO[m.name]||m.desc||""}</span>`;
    const cb = row.querySelector("input");
    cb.addEventListener("change",()=>{
      comps[id].visible = cb.checked;
      if (m.name==="ROBOT01") fanucIds.forEach(f=>comps[f].visible=cb.checked);
      dirty = true;
    });
    host.appendChild(row);
  }
  const L = META.layout || {}, dl = $("#layout");
  const rows = [];
  if (L.input_modules){const a=L.input_modules; rows.push(["투입 모듈",`${a.length}×${a.width}×${a.thickness} · ${a.quantity}장 · 적재 ${a.stack_height}`]);}
  if (L.output_glass){const a=L.output_glass; rows.push(["배출 유리",`${a.length}×${a.width}×${a.thickness} · ${a.quantity}장 · 적재 ${a.stack_height}`]);}
  if (L.waiting_table){const a=L.waiting_table; rows.push(["대기 테이블",`${a.length}×${a.width} H${a.height} · ${a.feet} · Ø${a.caster_diameter} 캐스터 · ${L.waiting_tables}대`]);}
  if (L.pallet_height_assumed) rows.push(["팔레트(가정)", `H${L.pallet_height_assumed}`]);
  rows.push(["설비 수", `로봇 ${L.robots??"-"} · reframe ${L.reframe??"-"} · 가공기 ${L.machining??"-"}`]);
  if (L.reference) rows.push(["원도면", L.reference]);
  rows.push(["전체 범위", `${Math.round(sceneHi[0]-sceneLo[0])} × ${Math.round(sceneHi[1]-sceneLo[1])} × ${Math.round(sceneHi[2]-sceneLo[2])} mm`]);
  let tris=0; for(const c of Object.values(comps)) tris+=c.nt/3;
  rows.push(["삼각형", `${Math.round(tris).toLocaleString()} (형상 ${Object.keys(comps).length}종, 배치 ${instances.length})`]);
  dl.innerHTML = rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("");
  $("#status-note").innerHTML = L.status ? `<b>상태:</b> ${L.status} — 원본 메모. 도달거리·구조·안전방호·택트는 미검증.` : "";
}

function showPick(){
  const box = $("#pick");
  if (sel.inst<0){ box.innerHTML = `<p class="empty">모델을 클릭하면 바디 이름·소속·치수가 표시된다.</p>`; return; }
  const ins = instances[sel.inst], c = comps[ins.c], m = c.meta;
  const name = m.names[sel.body];
  const bb = bodyBBox(ins.c, sel.body);
  const size = bb ? sub(bb.hi, bb.lo).map(v=>Math.round(v)).join(" × ") : "-";
  const ctr = bb ? M4.apply(ins.m, scl(add(bb.lo,bb.hi),0.5)).map(v=>Math.round(v)).join(", ") : "-";
  box.innerHTML = `<dl><dt>바디</dt><dd>${name}</dd><dt>부품</dt><dd>${m.name}</dd><dt>배치</dt><dd>${ins.label}</dd><dt>크기(로컬)</dt><dd>${size} mm</dd><dt>중심(월드)</dt><dd>${ctr}</dd><dt>색</dt><dd><span class="sw" style="display:inline-block;vertical-align:-2px;background:${rgbCss(m.colors[sel.body])}"></span> ${m.colors[sel.body].map(v=>Math.round(v*255)).join(",")}</dd></dl>`;
}

// 바디 bbox (CPU 측 위치 복사본에서)
const cpuPos = {};
function bodyBBox(cid, b){
  const P = cpuPos[cid]; if (!P) return null;
  if (!P.bb){
    const nb = comps[cid].meta.names.length;
    const lo = new Float32Array(nb*3).fill(1e9), hi = new Float32Array(nb*3).fill(-1e9);
    const {pos, bid} = P, c = comps[cid];
    for (let i=0;i<bid.length;i++){
      const k = bid[i]*3;
      for (let a=0;a<3;a++){const v=c.lo[a]+pos[i*3+a]/65535*c.span[a]; if(v<lo[k+a])lo[k+a]=v; if(v>hi[k+a])hi[k+a]=v;}
    }
    P.bb = {lo, hi};
  }
  const k=b*3; return {lo:[...P.bb.lo.subarray(k,k+3)], hi:[...P.bb.hi.subarray(k,k+3)]};
}

// ── 입력 ────────────────────────────────────────────────────────────────
let drag = null, moved = 0;
const tip = $("#tip");
canvas.addEventListener("contextmenu", e=>e.preventDefault());
canvas.addEventListener("pointerdown", e=>{
  canvas.setPointerCapture(e.pointerId);
  drag = {x:e.clientX, y:e.clientY, pan: e.button===2 || e.button===1 || e.shiftKey, pts:new Map([[e.pointerId,[e.clientX,e.clientY]]])};
  moved = 0; canvas.classList.add("dragging");
});
const touches = new Map();
canvas.addEventListener("pointermove", e=>{
  if (e.pointerType==="touch") touches.set(e.pointerId,[e.clientX,e.clientY]);
  if (!drag){
    if (e.pointerType!=="mouse") return;
    const r = canvas.getBoundingClientRect();
    const h = pickAt(e.clientX-r.left, e.clientY-r.top);
    if (h.inst!==hov.inst || h.body!==hov.body){ hov=h; dirty=true; }
    if (h.inst>=0){ tip.style.display="block"; tip.style.left=(e.clientX-r.left)+"px"; tip.style.top=(e.clientY-r.top)+"px";
      tip.textContent = `${comps[instances[h.inst].c].meta.names[h.body]} · ${instances[h.inst].label}`; }
    else tip.style.display="none";
    return;
  }
  const dx = e.clientX-drag.x, dy = e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY; moved += Math.abs(dx)+Math.abs(dy);
  if (touches.size>=2){ // 두 손가락: 확대 + 이동
    const [a,b] = [...touches.values()];
    const d = Math.hypot(a[0]-b[0],a[1]-b[1]);
    if (drag.pinch) cam.dist *= drag.pinch/d;
    drag.pinch = d;
  } else if (drag.pan){
    const s = cam.dist * 0.0012 * (canvas.width/canvas.clientWidth) * (1000/canvas.height) ;
    const right = [-Math.sin(cam.yaw), Math.cos(cam.yaw), 0];
    const up = cross(norm(sub(eye(), cam.target)), right).map(v=>-v);
    cam.target = add(cam.target, add(scl(right,-dx*s), scl(up, dy*s)));
  } else {
    cam.yaw -= dx*0.006; cam.pitch = Math.max(-0.1, Math.min(Math.PI/2-1e-4, cam.pitch + dy*0.006));
    cam.ortho = false;
  }
  tip.style.display="none"; dirty = true;
});
function endDrag(e){
  touches.delete(e.pointerId);
  if (!drag) return;
  canvas.classList.remove("dragging");
  if (moved < 4 && e.type==="pointerup"){
    const r = canvas.getBoundingClientRect();
    sel = pickAt(e.clientX-r.left, e.clientY-r.top); showPick(); dirty = true;
  }
  if (touches.size===0) drag = null; else drag.pinch = null;
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);
canvas.addEventListener("pointerleave", ()=>{ if(!drag){hov={inst:-1,body:-1}; tip.style.display="none"; dirty=true;} });
canvas.addEventListener("wheel", e=>{ e.preventDefault(); cam.dist *= Math.exp(e.deltaY*0.0012); cam.dist=Math.max(200, Math.min(cam.dist, 2e5)); dirty=true; }, {passive:false});
canvas.addEventListener("dblclick", e=>{
  const r = canvas.getBoundingClientRect();
  const h = pickAt(e.clientX-r.left, e.clientY-r.top);
  if (h.inst<0) return;
  const bb = bodyBBox(instances[h.inst].c, h.body);
  if (bb){ cam.target = M4.apply(instances[h.inst].m, scl(add(bb.lo,bb.hi),0.5)); cam.dist = Math.max(600, Math.hypot(...sub(bb.hi,bb.lo))*3); dirty=true; }
});
document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.view)));
$("#fit").addEventListener("click", fit);
$("#tagsBtn").addEventListener("click", e=>{ showTags=!showTags; e.currentTarget.setAttribute("aria-pressed", showTags); dirty=true; });
$("#theme").addEventListener("click", ()=>{
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark"; dirty = true;
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=>dirty=true);
function bindClip(id, axis){
  const el = $("#"+id), out = $("#"+id+"v");
  el.addEventListener("input", ()=>{
    const t = el.value/1000;
    if (t>=1){ clip[axis]=1e9; out.textContent="끔"; }
    else { const a = axis===0?0:2; clip[axis] = sceneLo[a] + (sceneHi[a]-sceneLo[a])*t; out.textContent = Math.round(clip[axis]); }
    dirty = true;
  });
}
bindClip("clipX",0); bindClip("clipZ",1);
window.addEventListener("keydown", e=>{ if(e.key==="Escape"){ sel={inst:-1,body:-1}; showPick(); dirty=true; } });

function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const w = Math.round(canvas.clientWidth*dpr), h = Math.round(canvas.clientHeight*dpr);
  if (canvas.width!==w || canvas.height!==h){ canvas.width=w; canvas.height=h; dirty=true; }
}
new ResizeObserver(resize).observe(canvas);

// ── 시작 ────────────────────────────────────────────────────────────────
(async function main(){
  if (META.name) $("#docname").textContent = META.name.replace(/_/g," ");
  const all = await inflate(GEOMETRY_B64);
  for (const [id, m] of Object.entries(META.components)){
    upload(id, m, all);
    const o = m.offset;
    cpuPos[id] = {pos: new Uint16Array(all.buffer, all.byteOffset+o, m.nv*3),
                  bid: new Uint16Array(all.buffer, all.byteOffset+o+pad4(m.nv*6)+pad4(m.nv*2), m.nv)};
  }
  const topNames = new Set(META.occurrences.filter(o=>o.parent===0).map(o=>o.name));
  sceneLo=[1e9,1e9,1e9]; sceneHi=[-1e9,-1e9,-1e9];
  instances = META.instances.map(ins=>{
    const c = comps[ins.c], m = new Float32Array(ins.m);
    const lo=[1e9,1e9,1e9], hi=[-1e9,-1e9,-1e9];
    for (let k=0;k<8;k++){
      const p = M4.apply(m, [c.lo[0]+(k&1?c.span[0]:0), c.lo[1]+(k&2?c.span[1]:0), c.lo[2]+(k&4?c.span[2]:0)]);
      for (let a=0;a<3;a++){lo[a]=Math.min(lo[a],p[a]);hi[a]=Math.max(hi[a],p[a]);}
    }
    for (let a=0;a<3;a++){sceneLo[a]=Math.min(sceneLo[a],lo[a]);sceneHi[a]=Math.max(sceneHi[a],hi[a]);}
    return {c:ins.c, m, label:ins.label, lo, hi, visible:true, top: topNames.has(ins.label) && !comps[ins.c].meta.name.startsWith("FANUC") && comps[ins.c].meta.name!=="LAYOUT_FLOOR_REFERENCE"};
  });
  buildFloor(); buildTags(); buildPanel(); resize(); setView("iso");
  $("#status").remove();
  render();
})().catch(err=>{ $("#status").textContent = "불러오기 실패: " + err.message; console.error(err); });
</script>
</body>
</html>
