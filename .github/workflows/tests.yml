name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 테스트 실행
        run: python -m unittest discover -s tests -t . --verbose

  calculation-report:
    # 설계 계산서(docs/design-calculation.md)가 코드와 어긋난 채로
    # 머지되는 것을 막는다. 재생성 결과가 커밋된 파일과 달라지면 실패.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 계산서 재생성
        run: PYTHONPATH=src python -m flotation_design -o docs/design-calculation.md

      - name: 커밋된 계산서와 일치하는지 확인
        run: |
          if ! git diff --exit-code -- docs/design-calculation.md; then
            echo "::error file=docs/design-calculation.md::계산서가 코드와 어긋납니다. \
          'PYTHONPATH=src python -m flotation_design -o docs/design-calculation.md' 를 실행하고 커밋하세요."
            exit 1
          fi

  simulation-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 시뮬레이션 선택 의존성 설치
        run: python -m pip install -e '.[simulation]'

      # unittest 잡은 numpy 를 설치하지 않아 분급 solver 테스트가 전부 skip 된다.
      # 의존성이 갖춰진 이 잡에서 실제로 돌려 물리 코어를 검증한다.
      - name: 분급 solver 검증
        run: CI_REQUIRE_SIM=1 python -m unittest tests.test_classifier_sim -v

      - name: 체분리 solver 검증
        run: CI_REQUIRE_SIM=1 python -m unittest tests.test_sieve_sim -v

      - name: 짧은 MP4 생성 확인
        env:
          SIM_SECONDS: "1"
          SIM_FPS: "2"
        run: |
          python tools/flotation_sim.py /tmp/fc201-smoke.mp4
          test -s /tmp/fc201-smoke.mp4
